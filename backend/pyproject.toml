[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvrag-backend"
version = "0.1.0"
description = "Reproducible EMC RAG showcase backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "elasticsearch==8.11.1",
  "numpy==2.2.6",
  "pypdfium2==5.12.1",
  "python-docx==1.2.0",
  "opencv-python-headless==4.12.0.88",
  "onnxruntime==1.22.1",
  "pyclipper==1.3.0.post6",
  "huggingface-hub==0.34.4",
  "tiktoken==0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "deepdoc: requires pinned DeepDOC ONNX assets",
  "integration: requires Elasticsearch or an external service",
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
