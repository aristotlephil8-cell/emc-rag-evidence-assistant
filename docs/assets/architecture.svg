<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">EMC RAG 系统架构、业务流程与数据流</title>
  <desc id="desc">图中从上到下展示业务流程、数据流和系统架构，并标出资料解析、检索、重排、生成、存储和模型服务之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 22px; font-weight: 700; }
      .lane-title { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .business { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .data { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .arch { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; }
      .rag { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .support { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
      .result { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
      .flow { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .relation { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .main-flow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="#ffffff"/>
  <text x="800" y="35" text-anchor="middle" class="title">EMC RAG 系统架构、业务流程与数据流</text>

  <rect x="60" y="60" width="1480" height="150" rx="12" class="lane"/>
  <text x="800" y="87" text-anchor="middle" class="lane-title">业务流程</text>
  <rect x="100" y="120" width="210" height="58" rx="9" class="business"/>
  <rect x="390" y="120" width="210" height="58" rx="9" class="business"/>
  <rect x="680" y="120" width="210" height="58" rx="9" class="business"/>
  <rect x="970" y="120" width="210" height="58" rx="9" class="business"/>
  <rect x="1260" y="120" width="240" height="58" rx="9" class="business"/>
  <text x="205" y="155" text-anchor="middle" class="label">资料管理</text>
  <text x="495" y="155" text-anchor="middle" class="label">EMC 问题咨询</text>
  <text x="785" y="155" text-anchor="middle" class="label">证据检索</text>
  <text x="1075" y="155" text-anchor="middle" class="label">结论生成</text>
  <text x="1380" y="155" text-anchor="middle" class="label">引用查看 / 人工复核</text>
  <path d="M310 149 H390 M600 149 H680 M890 149 H970 M1180 149 H1260" class="main-flow"/>

