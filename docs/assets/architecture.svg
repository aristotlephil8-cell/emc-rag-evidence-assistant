  <rect x="250" y="305" width="140" height="72" rx="8" class="data"/>
  <rect x="410" y="305" width="135" height="72" rx="8" class="data"/>
  <rect x="565" y="295" width="170" height="92" rx="8" class="data"/>
  <rect x="755" y="305" width="125" height="72" rx="8" class="data"/>
  <rect x="900" y="305" width="115" height="72" rx="8" class="data"/>
  <rect x="1035" y="305" width="150" height="72" rx="8" class="data"/>
  <rect x="1205" y="305" width="165" height="72" rx="8" class="data"/>
  <rect x="1390" y="305" width="125" height="72" rx="8" class="result"/>
  <text x="157" y="335" text-anchor="middle" class="label"><tspan x="157" dy="0">标准 / 手册 /</tspan><tspan x="157" dy="20">报告 / 案例</tspan></text>
  <text x="320" y="345" text-anchor="middle" class="label">解析与结构化</text>
  <text x="477" y="345" text-anchor="middle" class="label">Chunk + Metadata</text>
  <text x="650" y="330" text-anchor="middle" class="label"><tspan x="650" dy="0">Elasticsearch</tspan><tspan x="650" dy="20" class="small">倒排 + 向量索引</tspan></text>
  <text x="817" y="345" text-anchor="middle" class="label">Top-K 候选</text>
  <text x="957" y="345" text-anchor="middle" class="label">Rerank</text>
  <text x="1110" y="345" text-anchor="middle" class="label">Evidence Context</text>
  <text x="1287" y="335" text-anchor="middle" class="label"><tspan x="1287" dy="0">Claims +</tspan><tspan x="1287" dy="20">Citation IDs</tspan></text>
  <text x="1452" y="335" text-anchor="middle" class="label"><tspan x="1452" dy="0">回答 / 拒答 /</tspan><tspan x="1452" dy="20">人工确认</tspan></text>
  <path d="M230 341 H250 M390 341 H410 M545 341 H565 M735 341 H755 M880 341 H900 M1015 341 H1035 M1185 341 H1205 M1370 341 H1390" class="flow"/>

  <rect x="60" y="470" width="1480" height="630" rx="12" class="lane"/>
  <text x="800" y="498" text-anchor="middle" class="lane-title">系统架构</text>

  <rect x="100" y="530" width="1400" height="115" rx="10" class="arch"/>
  <text x="800" y="555" text-anchor="middle" class="lane-title">交互层</text>
  <rect x="260" y="575" width="240" height="42" rx="7" class="arch"/>
  <rect x="680" y="575" width="240" height="42" rx="7" class="arch"/>
  <rect x="1100" y="575" width="240" height="42" rx="7" class="arch"/>
