  <rect x="260" y="720" width="240" height="42" rx="7" class="arch"/>
  <rect x="680" y="720" width="240" height="42" rx="7" class="arch"/>
  <rect x="1100" y="720" width="240" height="42" rx="7" class="arch"/>
  <text x="380" y="746" text-anchor="middle" class="label">FastAPI 入口</text>
  <text x="800" y="746" text-anchor="middle" class="label">路由与认证</text>
  <text x="1220" y="746" text-anchor="middle" class="label">Chat / Document / Session</text>
  <path d="M500 741 H680 M920 741 H1100" class="flow"/>

  <rect x="100" y="820" width="1400" height="115" rx="10" class="rag"/>
  <text x="800" y="845" text-anchor="middle" class="lane-title">RAG 核心</text>
  <rect x="260" y="865" width="240" height="42" rx="7" class="rag"/>
  <rect x="680" y="865" width="240" height="42" rx="7" class="rag"/>
  <rect x="1100" y="865" width="240" height="42" rx="7" class="rag"/>
  <text x="380" y="891" text-anchor="middle" class="label">资料解析与入库</text>
  <text x="800" y="891" text-anchor="middle" class="label">检索与重排</text>
  <text x="1220" y="891" text-anchor="middle" class="label">提示词构建与生成</text>
  <path d="M500 886 H680 M920 886 H1100" class="flow"/>

  <rect x="100" y="965" width="1400" height="105" rx="10" class="support"/>
  <text x="800" y="990" text-anchor="middle" class="lane-title">基础设施与模型服务</text>
  <rect x="170" y="1010" width="180" height="38" rx="7" class="support"/>
  <rect x="410" y="1010" width="180" height="38" rx="7" class="support"/>
  <rect x="650" y="1010" width="150" height="38" rx="7" class="support"/>
  <rect x="860" y="1010" width="150" height="38" rx="7" class="support"/>
  <rect x="1070" y="1010" width="360" height="38" rx="7" class="support"/>
  <text x="260" y="1035" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="500" y="1035" text-anchor="middle" class="label">Elasticsearch</text>
  <text x="725" y="1035" text-anchor="middle" class="label">Redis</text>
  <text x="935" y="1035" text-anchor="middle" class="label">文件存储</text>
  <text x="1250" y="1035" text-anchor="middle" class="label">DeepDOC / Embedding / Rerank / LLM</text>

