name: cvrag-private

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${CVRAG_PRIVATE_ELASTICSEARCH_PORT:-19200}:9200"
    volumes:
      - ./datasets/private_local/runtime/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    restart: "no"
