name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public licensing and repository boundaries
        shell: bash
        run: |
          test -f LICENSE
          grep -q "Apache License" LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f backend/app/ingestion/THIRD_PARTY_NOTICES.md
          if git ls-files | grep -E '(^|/)(\.env$|tmp/|\.tmp/|evaluation/private/|models/deepdoc/)'; then
            echo "Forbidden private, temporary, secret, or model path is tracked."
            exit 1
          fi
          private_path_pattern='S2_6[\\/]'
          private_path_pattern+='swxy'
          resume_pattern='张俊_'
          resume_pattern+='北航'
          if git grep -I -n -E "${private_path_pattern}|${resume_pattern}"; then
            echo "A private reference path or resume identifier was found."
            exit 1
          fi
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  backend:
    runs-on: ubuntu-24.04
    env:
      CVRAG_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Lint backend
        run: >-
          python -m ruff check
          backend/app backend/scripts backend/tests evaluation datasets
          scripts/elasticsearch_smoke.py
      - name: Run isolated backend tests with offline provider
        run: python -m pytest backend/tests -m "not deepdoc and not integration"
      - name: Validate frozen synthetic data
        run: python evaluation/validate_dataset.py
      - name: Test evaluation metrics
        run: python -m unittest discover -s evaluation/tests -v

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deepdoc-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CVRAG_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Restore verified DeepDOC assets
        uses: actions/cache@v4
        with:
          path: backend/models/deepdoc
          key: deepdoc-de0e793dc6d744406c96dabd688ccc969f41b443-${{ hashFiles('backend/app/ingestion/deepdoc_assets_manifest.json') }}
      - name: Download and verify pinned DeepDOC assets
        run: python backend/scripts/prepare_deepdoc_assets.py --model-dir backend/models/deepdoc
      - name: Run real scanned and table PDF DeepDOC smoke tests
        env:
          CVRAG_DEEPDOC_MODEL_DIR: ${{ github.workspace }}/backend/models/deepdoc
          CVRAG_DEEPDOC_SCAN_PDF: ${{ github.workspace }}/datasets/generated/documents/synthetic_cable_scan.pdf
          CVRAG_DEEPDOC_TABLE_PDF: ${{ github.workspace }}/datasets/generated/documents/synthetic_priority_table.pdf
        run: python -m pytest backend/tests/test_ingestion_deepdoc_smoke.py -m deepdoc -v

  elasticsearch-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CVRAG_PROVIDER: offline
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          --health-interval 10s
          --health-timeout 6s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Verify strict mapping, BM25, and kNN against Elasticsearch 8.11.3
        working-directory: backend
        run: python ../scripts/elasticsearch_smoke.py
